# Protean CI — the gate. Red = not mergeable (Law 1: no workarounds to force green).
name: ci
on:
  push:
    branches: [main, "phase/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            APP/CODE/package-lock.json
            APP/GUI/package-lock.json

      - name: Install CODE
        working-directory: APP/CODE
        run: npm ci

      - name: Typecheck CODE
        working-directory: APP/CODE
        run: npx tsc --noEmit

      - name: Test CODE
        working-directory: APP/CODE
        run: npm test

      - name: Install GUI
        working-directory: APP/GUI
        run: npm ci

      - name: Typecheck GUI
        working-directory: APP/GUI
        run: npx tsc --noEmit

      - name: Build GUI
        working-directory: APP/GUI
        run: npm run build

      - name: Guard — no secrets committed
        # Matches secret VALUES, not variable NAMES. Legit source must reference
        # ANTHROPIC_API_KEY / AWS_BEARER_TOKEN as env-var keys — flagging those is a
        # false positive. We flag: real Anthropic keys (sk-ant-…), long sk- keys,
        # AWS bearer tokens (ABSK…), and any NAME assigned a quoted literal value.
        run: |
          if git grep -nE "(sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|ABSK[A-Za-z0-9+/]{16,}|(ANTHROPIC_API_KEY|AWS_BEARER_TOKEN[A-Z_]*)[[:space:]]*=[[:space:]]*['\"][^'\"$}]{12,})" -- ':!*.example' ':!.github/*' ; then
            echo "::error::Possible secret committed"; exit 1; fi
